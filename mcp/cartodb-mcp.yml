  discovery: CARTO Workspace > Developers > Workflow API & MCP Server (CARTO AI)
auth:
- method: OAuth (U2M)
  note: >-
    Interactive login. Claude.ai and Claude Code connect with just the URL (no
    OAuth client needed); other clients use an SPA OAuth client.
- method: OAuth (M2M)
  note: Unattended access using an M2M OAuth client.
- method: API Access Token
  note: >-
    Unattended access with predefined scopes. The list_maps tool is currently
    unavailable with this method.
tools:
- group: platform
  items:
  - name: list_connections
    description: List data-warehouse connections available to the agent.
  - name: list_resources
    description: Browse available tables and resources.
  - name: search_resources
    description: Locate specific tables or datasets.
  - name: describe
    description: Inspect column distributions and table details.
  - name: list_maps
    description: Locate saved maps.
- group: interactive
  items:
  - name: view_map
    description: Render ad-hoc interactive visualizations inline in chat.
  - name: load_builder_map
    description: Display saved CARTO Builder maps within the conversation.
- group: workflow
  items:
  - name: '<published workflows>'
    description: Run custom analytical workflows the organization has published.
  - name: async_workflow_job_get_status_v1_0_0
    description: Check the status of asynchronous workflow executions.
  - name: async_workflow_job_get_results_v1_0_0
