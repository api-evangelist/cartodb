rate_limiting:
  note: Usage is metered against org quotas (Pay-As-You-Go / committed tiers); see pricing and org quota tooling (carto org).
idempotency:
  supported: unknown
  note: >-
    No provider-documented idempotency-key contract was found for the Cloud-Native
    REST API; not asserting idempotency support.
