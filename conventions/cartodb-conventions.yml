async_jobs:
  note: >-
    The SQL API separates synchronous queries (GET /v3/sql/{connection}/query,
    which return results) from asynchronous SQL jobs (POST /v3/sql/{connection}/job)
    for long-running DDL/DML; MCP/Workflow async jobs expose get_status and
    get_results operations for polling.
regionalization:
  note: >-
    The API base host is region/tenant specific (e.g. gcp-us-east1.api.carto.com);
    clients must target their organization's assigned regional host.
