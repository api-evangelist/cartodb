aid: cartodb
name: CARTO
description: >-
  CARTO (formerly CartoDB) is a cloud-native location intelligence and spatial
  analytics platform that runs directly on top of modern cloud data warehouses
  including Google BigQuery, Snowflake, Amazon Redshift, Databricks, PostgreSQL
  and Oracle. Developers use the CARTO Cloud-Native (v3) APIs — SQL API, Maps API,
  Import/Export API, Location Data Services (geocoding, routing, isolines) and the
  Data Observatory — together with the deck.gl visualization stack, the CARTO for
  React library, and Python packages to build interactive geospatial applications
  and analytical workflows. CARTO is notably agent-native: it ships a hosted MCP
  Server, a first-party `carto` CLI, and a public catalog of 23 Agent Skills for
  spatial analysis. Authentication is via permanent API Access Tokens or Auth0-backed
  OAuth (SPA authorization-code and machine-to-machine client-credentials) scoped to
  the `carto-cloud-native-api` audience.
